name: CI — Data Lakehouse Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Code quality and unit tests ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock pytest-cov python-dotenv

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ tests/ scripts/ --output-format=github
        continue-on-error: false

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
          LOG_LEVEL: WARNING
        run: |
          python -m pytest tests/unit/ -v \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --tb=short \
            -p no:warnings

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ── Data generation validation ───────────────────────────────────────────────
  validate-data-generation:
    name: Validate Data Generation
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependencies
        run: pip install python-dotenv

      - name: Generate sample data
        run: python scripts/generate_data.py --seed 42 --customers 50 --products 20 --orders 200

      - name: Validate generated files
        run: |
          python -c "
          import csv, sys
          files = {
              'data/sample/customers.csv': ['customer_id', 'first_name', 'last_name', 'email'],
              'data/sample/products.csv': ['product_id', 'product_name', 'unit_price'],
              'data/sample/orders.csv': ['order_id', 'customer_id', 'product_id', 'order_date'],
          }
          for path, required_cols in files.items():
              with open(path) as f:
                  reader = csv.DictReader(f)
                  cols = reader.fieldnames or []
                  missing = [c for c in required_cols if c not in cols]
                  if missing:
                      print(f'FAIL {path} missing columns: {missing}')
                      sys.exit(1)
                  rows = list(reader)
                  print(f'OK   {path}  columns={len(cols)}  rows={len(rows)}')
          "

  # ── SQL validation ──────────────────────────────────────────────────────────
  validate-sql:
    name: Validate SQL Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sqlfluff
        run: pip install sqlfluff

      - name: Lint SQL files
        run: |
          sqlfluff lint sql/ \
            --dialect postgres \
            --rules L001,L002,L003,L010,L011 \
            --ignore-local-config
        continue-on-error: true   # Warn but don't fail on SQL style issues

  # ── Docker Compose validation ───────────────────────────────────────────────
  validate-docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: |
          cp .env.example .env
          # Generate a valid Fernet key for testing
          pip install cryptography
          python -c "
          from cryptography.fernet import Fernet
          key = Fernet.generate_key().decode()
          with open('.env', 'a') as f:
              f.write(f'\nAIRFLOW__CORE__FERNET_KEY={key}\n')
              f.write('AIRFLOW__WEBSERVER__SECRET_KEY=ci_test_secret_key\n')
          "

      - name: Validate Docker Compose config
        run: docker compose config --quiet

  # ── Security scan ───────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit security scan
        run: |
          bandit -r src/ scripts/ \
            -ll \
            --skip B101,B601 \
            --format txt
        continue-on-error: true   # Report issues but don't gate CI yet
